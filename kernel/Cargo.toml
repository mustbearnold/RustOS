[package]
name = "rustos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rustos-kernel"
path = "src/main.rs"

[dependencies]
bootloader_api = "=0.11.17"
rustos-gpu-protocol = { path = "../gpu-protocol", default-features = false }
linked_list_allocator = { version = "=0.10.5", default-features = false, features = ["use_spin"] }
noto-sans-mono-bitmap = { version = "=0.2.0", default-features = false, features = ["regular", "size_16", "unicode-basic-latin"] }
pic8259 = "=0.11.0"
spin = { version = "=0.12.2", default-features = false, features = ["mutex", "spin_mutex", "once"] }
x86_64 = "=0.15.5"
